<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" width="900" height="378" role="img" aria-label="向いていない場合の判断図。この進め方は、確かさを手間で買うものです。使わないほうがよい場面が3つ。1、数時間で捨てる試作品 — 承認や確認の手間のほうが高くつきます。2、すでに大きなプログラムがあり、そこへ後から足す場合 — この仕組みは、新しく始めることが前提です。3、プログラムを書ける人が何人もいるチーム — 承認する人が1人である前提のため、人どうしのレビューと二重になります。決め方は、はかりで表せます。片方の皿に「確かめる手間」、もう片方に「失敗したときの痛手」を載せ、痛手のほうが重いときに使います。迷ったら、最初の1機能だけを両方のやり方で見積もってください。">
<rect x="0" y="0" width="900" height="378" fill="#FCFBF9"/>
<text x="450" y="36" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="16" text-anchor="middle" fill="#2B2B2B" font-weight="bold">確かさを「手間」で買う進め方です。手間が見合わないなら、使わない</text>

<rect x="34" y="60" width="470" height="216" rx="10" fill="#FBEDEA" stroke="#B03A2E" stroke-width="1.5"/>
<text x="58" y="92" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" fill="#B03A2E" font-weight="bold">使わないほうがよい場面</text>

<circle cx="64" cy="123" r="5" fill="#B03A2E"/>
<text x="80" y="128" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" fill="#2B2B2B" font-weight="bold">数時間で捨てる試作品</text>
<text x="80" y="148" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12" fill="#8C3D33">承認や確認の手間のほうが高くつきます</text>

<circle cx="64" cy="175" r="5" fill="#B03A2E"/>
<text x="80" y="180" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" fill="#2B2B2B" font-weight="bold">すでに大きなプログラムがあり、後から足す</text>
<text x="80" y="200" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12" fill="#8C3D33">この仕組みは、新しく始めることが前提です</text>

<circle cx="64" cy="227" r="5" fill="#B03A2E"/>
<text x="80" y="232" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" fill="#2B2B2B" font-weight="bold">プログラムを書ける人が何人もいるチーム</text>
<text x="80" y="252" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12" fill="#8C3D33">承認する人が1人である前提。人どうしのレビューと二重になります</text>

<rect x="528" y="60" width="338" height="216" rx="10" fill="#F5F2EC" stroke="#1F6F6B" stroke-width="1.5"/>
<text x="552" y="92" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" fill="#1F6F6B" font-weight="bold">決め方</text>

<path d="M 592 129 L 802 153" stroke="#1F6F6B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<path d="M 697 141 V 164" stroke="#1F6F6B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<path d="M 697 162 L 684 184 L 710 184 Z" fill="#1F6F6B"/>
<path d="M 672 186 H 722" stroke="#1F6F6B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<path d="M 612 131 V 143" stroke="#6E6A64" stroke-width="1.5" fill="none"/>
<path d="M 782 151 V 163" stroke="#6E6A64" stroke-width="1.5" fill="none"/>
<path d="M 590 143 Q 612 163 634 143" stroke="#6E6A64" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<path d="M 760 163 Q 782 183 804 163" stroke="#6E6A64" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<text x="612" y="206" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" text-anchor="middle" fill="#6E6A64">確かめる手間</text>
<text x="782" y="206" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" text-anchor="middle" fill="#6E6A64">失敗したときの痛手</text>
<text x="697" y="244" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13.5" text-anchor="middle" fill="#2B2B2B" font-weight="bold">痛手のほうが重いときに、使う</text>

<rect x="34" y="300" width="832" height="52" rx="10" fill="#FFFFFF" stroke="#D8D4CC" stroke-width="1.5"/>
<text x="450" y="331" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" text-anchor="middle" fill="#2B2B2B">迷ったら、最初の1機能だけを両方のやり方で見積もってください</text>
</svg>
