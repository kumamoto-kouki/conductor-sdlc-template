<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="人の目が要る2つの場面が、別々の理由で残っていることを示す図。上段は AI 側で、ここまでは機械で回ります。調べ役、まとめ役、作る役、チェック役の4つの役が順に並んでいます。機械で回るのは次の2つがそろっているからです。ひとつは「できた」の基準があること。その基準は、あなたが承認した書類です。もうひとつは、作る役とは別の「チェック役」が見ることです。それでも、機械の外に2つ残ります。1つめは、画面の見た目が良いかどうか。欠けているものは「良い」の基準です。「良い」の基準は、あなたの会社・その現場にしかありません。AI は持っていません。だからあなたが見ます。詳しい人でも代われません。2つめは、「できました」が本当かどうか。欠けているものは、作った側の外の目です。「できました」と言うのは、作った AI 自身です。役をいくつに分けても、全部「作った側」です。だからあなたが動かして見ます。こちらは詳しい人なら手伝えます。実際に試したところ、この2箇所で必ず止まりました。説明を丁寧にしても、なくなりませんでした。相談できる人を1人決めておくと確実ですが、必須ではありません。いなくても進められます。">
<rect x="0" y="0" width="900" height="660" fill="#FCFBF9"/>
<text x="450" y="42" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="18" text-anchor="middle" fill="#2B2B2B" font-weight="bold">この2つは、別々の理由で残っています</text>

<rect x="34" y="68" width="832" height="124" rx="10" fill="#F5F2EC" stroke="#D8D4CC" stroke-width="1"/>
<text x="62" y="96" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" fill="#4A5C8C" font-weight="bold">AI 側 — ここまでは機械で回ります</text>

<rect x="62" y="122" width="84" height="28" rx="14" fill="#4A5C8C" fill-opacity="0.12" stroke="#4A5C8C" stroke-opacity="0.45" stroke-width="1"/>
<text x="104" y="141" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#4A5C8C" font-weight="bold">調べ役</text>
<path d="M 150 136 L 160 136 M 156 132 L 161 136 L 156 140" stroke="#9A948A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="166" y="122" width="84" height="28" rx="14" fill="#4A5C8C" fill-opacity="0.12" stroke="#4A5C8C" stroke-opacity="0.45" stroke-width="1"/>
<text x="208" y="141" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#4A5C8C" font-weight="bold">まとめ役</text>
<path d="M 254 136 L 264 136 M 260 132 L 265 136 L 260 140" stroke="#9A948A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="270" y="122" width="84" height="28" rx="14" fill="#4A5C8C" fill-opacity="0.12" stroke="#4A5C8C" stroke-opacity="0.45" stroke-width="1"/>
<text x="312" y="141" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#4A5C8C" font-weight="bold">作る役</text>
<path d="M 358 136 L 368 136 M 364 132 L 369 136 L 364 140" stroke="#9A948A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="374" y="122" width="84" height="28" rx="14" fill="#B03A2E" fill-opacity="0.12" stroke="#B03A2E" stroke-opacity="0.5" stroke-width="1"/>
<text x="416" y="141" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#B03A2E" font-weight="bold">チェック役</text>

<text x="520" y="96" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#6E6A64">機械で回るのは、次の2つがそろっているからです</text>
<circle cx="526" cy="122" r="5" fill="#2E7D4F"/>
<text x="542" y="127" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" fill="#2B2B2B">「できた」の基準がある（あなたが承認した書類）</text>
<circle cx="526" cy="150" r="5" fill="#2E7D4F"/>
<text x="542" y="155" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" fill="#2B2B2B">作る役とは別の「チェック役」が見る</text>

<line x1="450" y1="192" x2="450" y2="210" stroke="#9A948A" stroke-width="2"/>
<text x="450" y="234" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="16" text-anchor="middle" fill="#2B2B2B" font-weight="bold">それでも、機械の外に2つ残ります</text>

<rect x="34" y="252" width="397" height="278" rx="10" fill="#FFFFFF" stroke="#8A6A2F" stroke-width="2"/>
<circle cx="71" cy="286" r="13" fill="#8A6A2F"/>
<text x="71" y="291" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="bold">1</text>
<text x="94" y="292" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" fill="#2B2B2B" font-weight="bold">画面の見た目が良いかどうか</text>
<line x1="58" y1="312" x2="407" y2="312" stroke="#E5E0D6" stroke-width="1"/>
<text x="58" y="353" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12" fill="#6E6A64">欠けているもの</text>
<rect x="152" y="335" width="118" height="28" rx="6" fill="#8A6A2F" fill-opacity="0.06" stroke="#8A6A2F" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="211" y="354" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" text-anchor="middle" fill="#8A6A2F" font-weight="bold">「良い」の基準</text>
<text x="58" y="396" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#2B2B2B">「良い」の基準は、あなたの会社・その現場に</text>
<text x="58" y="418" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#2B2B2B">しかありません。AI は持っていません。</text>
<rect x="58" y="440" width="349" height="66" rx="8" fill="#F5F2EC" stroke="#D8D4CC" stroke-width="1"/>
<text x="78" y="469" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13.5" fill="#2B2B2B" font-weight="bold">あなたが見ます</text>
<text x="78" y="493" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#8A6A2F" font-weight="bold">詳しい人でも代われません</text>

<rect x="469" y="252" width="397" height="278" rx="10" fill="#FFFFFF" stroke="#B03A2E" stroke-width="2"/>
<circle cx="506" cy="286" r="13" fill="#B03A2E"/>
<text x="506" y="291" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="bold">2</text>
<text x="529" y="292" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" fill="#2B2B2B" font-weight="bold">「できました」が本当かどうか</text>
<line x1="493" y1="312" x2="842" y2="312" stroke="#E5E0D6" stroke-width="1"/>
<text x="493" y="353" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12" fill="#6E6A64">欠けているもの</text>
<rect x="587" y="335" width="140" height="28" rx="6" fill="#B03A2E" fill-opacity="0.06" stroke="#B03A2E" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="657" y="354" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" text-anchor="middle" fill="#B03A2E" font-weight="bold">作った側の外の目</text>
<text x="493" y="396" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#2B2B2B">「できました」と言うのは、作った AI 自身です。</text>
<text x="493" y="418" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#2B2B2B">役をいくつに分けても、全部「作った側」です。</text>
<rect x="493" y="440" width="349" height="66" rx="8" fill="#F5F2EC" stroke="#D8D4CC" stroke-width="1"/>
<text x="513" y="469" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13.5" fill="#2B2B2B" font-weight="bold">あなたが動かして見ます</text>
<text x="513" y="493" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#B03A2E" font-weight="bold">こちらは、詳しい人なら手伝えます</text>

<rect x="34" y="560" width="832" height="76" rx="10" fill="#F5F2EC" stroke="#D8D4CC" stroke-width="1"/>
<text x="450" y="592" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" text-anchor="middle" fill="#2B2B2B">実際に試したところ、この2箇所で必ず止まりました。説明を丁寧にしても、なくなりませんでした。</text>
<text x="450" y="617" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#6E6A64">相談できる人を1人決めておくと確実ですが、必須ではありません。いなくても進められます。</text>
</svg>
