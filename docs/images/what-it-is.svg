<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" role="img" aria-label="あなたの会社の仕事に合わせたソフトを、AI に作らせる話です。流れは3つ。① あなたが言葉で伝える（「見積書を作るのに時間がかかってる」のように、専門用語は要りません）。② AI がプログラムを書く。AI はひとつではなく、4つの役に分かれて動きます。調べ役が調べて案を出し、まとめ役が作る前の書類を書き、作る役がプログラムを書き、チェック役ができたものを検査します。作る役とチェック役は、必ず別の AI にします。読めなくても、③で確かめられます。③ 本当にできているか確かめる（決めたとおりに作られたか／作った AI に合格を出させない／最後に、あなたが動かして見る。ひとつでも欠けたら、完成にしません）。AI に任せるだけでは、この③が抜けます。この流れの中であなたがやることは2つで、①の「何を作るかを決める」（現場のことを知っているのは、あなただけ）と、③の「動かして確かめてから承認する」（自分の書類を1枚、最初から最後まで作らせて確かめます）です。">
<rect x="0" y="0" width="900" height="516" fill="#FCFBF9"/>
<text x="450" y="40" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="18" text-anchor="middle" fill="#2B2B2B" font-weight="bold">あなたの会社の仕事に合わせたソフトを、AI に作らせる話です</text>

<rect x="34" y="84" width="252" height="214" rx="10" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="2"/>
<rect x="34" y="84" width="252" height="36" rx="10" fill="#1F6F6B"/>
<rect x="34" y="106" width="252" height="14" fill="#1F6F6B"/>
<text x="160" y="108" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="bold">① あなたが言葉で伝える</text>
<path d="M 66 164 h 188 a8 8 0 0 1 8 8 v 54 a8 8 0 0 1 -8 8 h -150 l -22 20 v -20 h -16 a8 8 0 0 1 -8 -8 v -54 a8 8 0 0 1 8 -8 z" fill="#EAF2F1" stroke="#1F6F6B" stroke-width="1.5"/>
<text x="82" y="196" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" fill="#2B2B2B">「見積書を作るのに</text>
<text x="82" y="220" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" fill="#2B2B2B">　時間がかかってる」</text>
<text x="160" y="322" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#6E6A64">専門用語は要りません</text>

<line x1="292" y1="191" x2="312" y2="191" stroke="#6E6A64" stroke-width="2.5"/><path d="M 320 191 L 310 185 L 310 197 Z" fill="#6E6A64"/>

<rect x="324" y="84" width="252" height="214" rx="10" fill="#FFFFFF" stroke="#4A5C8C" stroke-width="2"/>
<rect x="324" y="84" width="252" height="36" rx="10" fill="#4A5C8C"/>
<rect x="324" y="106" width="252" height="14" fill="#4A5C8C"/>
<text x="450" y="108" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="bold">② AI がプログラムを書く</text>
<text x="348" y="140" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#6E6A64">AI は役ごとに分かれています</text>

<rect x="348" y="148" width="68" height="20" rx="10" fill="#4A5C8C" fill-opacity="0.12" stroke="#4A5C8C" stroke-opacity="0.45" stroke-width="1"/>
<text x="382" y="162" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" text-anchor="middle" fill="#4A5C8C" font-weight="bold">調べ役</text>
<text x="424" y="162" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#2B2B2B">調べて案を出す</text>

<rect x="348" y="174" width="68" height="20" rx="10" fill="#4A5C8C" fill-opacity="0.12" stroke="#4A5C8C" stroke-opacity="0.45" stroke-width="1"/>
<text x="382" y="188" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" text-anchor="middle" fill="#4A5C8C" font-weight="bold">まとめ役</text>
<text x="424" y="188" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#2B2B2B">作る前の書類を書く</text>

<rect x="348" y="200" width="68" height="20" rx="10" fill="#4A5C8C" fill-opacity="0.12" stroke="#4A5C8C" stroke-opacity="0.45" stroke-width="1"/>
<text x="382" y="214" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" text-anchor="middle" fill="#4A5C8C" font-weight="bold">作る役</text>
<text x="424" y="214" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#2B2B2B">プログラムを書く</text>

<line x1="348" y1="230" x2="552" y2="230" stroke="#B03A2E" stroke-width="1.5" stroke-dasharray="5 4"/>

<rect x="348" y="240" width="68" height="20" rx="10" fill="#B03A2E" fill-opacity="0.12" stroke="#B03A2E" stroke-opacity="0.5" stroke-width="1"/>
<text x="382" y="254" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" text-anchor="middle" fill="#B03A2E" font-weight="bold">チェック役</text>
<text x="424" y="254" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#2B2B2B">できたものを検査する</text>
<text x="450" y="280" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11" text-anchor="middle" fill="#B03A2E" font-weight="bold">作る役とチェック役は、必ず別の AI</text>
<text x="450" y="322" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#6E6A64">読めなくても、③で確かめられます</text>

<line x1="582" y1="191" x2="602" y2="191" stroke="#6E6A64" stroke-width="2.5"/><path d="M 610 191 L 600 185 L 600 197 Z" fill="#6E6A64"/>

<text x="740" y="70" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" text-anchor="middle" fill="#2E7D4F" font-weight="bold">▼ AI に任せるだけでは、ここが抜けます</text>
<rect x="614" y="84" width="252" height="214" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/>
<rect x="614" y="84" width="252" height="36" rx="10" fill="#2E7D4F"/>
<rect x="614" y="106" width="252" height="14" fill="#2E7D4F"/>
<text x="740" y="108" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="bold">③ 本当にできているか確かめる</text>
<rect x="638" y="162" width="17" height="17" rx="3" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="664" y="176" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#2B2B2B">決めたとおりに作られたか</text>
<rect x="638" y="200" width="17" height="17" rx="3" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="664" y="214" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#2B2B2B">作った AI に合格を出させない</text>
<rect x="638" y="238" width="17" height="17" rx="3" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="664" y="252" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" fill="#2B2B2B">最後に、あなたが動かして見る</text>
<text x="740" y="322" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#2E7D4F" font-weight="bold">ひとつでも欠けたら、完成にしません</text>

<rect x="34" y="352" width="832" height="134" rx="10" fill="#F5F2EC" stroke="#D8D4CC" stroke-width="1"/>
<text x="62" y="386" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="16" fill="#2B2B2B" font-weight="bold">この流れの中で、あなたがやること</text>
<rect x="62" y="406" width="374" height="54" rx="27" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="1.5"/>
<circle cx="92" cy="433" r="13" fill="#1F6F6B"/>
<text x="92" y="438" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="bold">1</text>
<text x="116" y="428" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14.5" fill="#2B2B2B" font-weight="bold">何を作るかを決める</text>
<text x="116" y="448" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#6E6A64">現場のことを知っているのは、あなただけ</text>
<rect x="464" y="406" width="374" height="54" rx="27" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
<circle cx="494" cy="433" r="13" fill="#2E7D4F"/>
<text x="494" y="438" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="bold">3</text>
<text x="518" y="428" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14.5" fill="#2B2B2B" font-weight="bold">動かして確かめてから承認する</text>
<text x="518" y="448" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#6E6A64">自分の書類を1枚、最初から最後まで作らせて確かめます</text>
</svg>
