<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="あなたの会社の仕事に合わせたソフトを、AI に作らせる話です。流れは3つ。① あなたが言葉で伝える（「見積書を作るのに時間がかかってる」のように、専門用語は要りません）。② AI がプログラムを書く（読めなくても、③で確かめられます）。③ 本当にできているか確かめる（決めたとおりに作られたか／作った AI に合格を出させない／最後に、あなたが動かして見る。ひとつでも欠けたら、完成にしません）。AI に任せるだけでは、この③が抜けます。この流れの中であなたがやることは2つで、①の「何を作るかを決める」（現場のことを知っているのは、あなただけ）と、③の「動かして確かめてから承認する」（自分の書類を1枚、最初から最後まで作らせて確かめます）です。">
<rect x="0" y="0" width="900" height="500" fill="#FCFBF9"/>
<text x="450" y="40" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="18" text-anchor="middle" fill="#2B2B2B" font-weight="bold">あなたの会社の仕事に合わせたソフトを、AI に作らせる話です</text>

<rect x="34" y="84" width="252" height="190" rx="10" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="2"/>
<rect x="34" y="84" width="252" height="36" rx="10" fill="#1F6F6B"/>
<rect x="34" y="106" width="252" height="14" fill="#1F6F6B"/>
<text x="160" y="108" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="bold">① あなたが言葉で伝える</text>
<path d="M 66 140 h 188 a8 8 0 0 1 8 8 v 54 a8 8 0 0 1 -8 8 h -150 l -22 20 v -20 h -16 a8 8 0 0 1 -8 -8 v -54 a8 8 0 0 1 8 -8 z" fill="#EAF2F1" stroke="#1F6F6B" stroke-width="1.5"/>
<text x="82" y="172" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" fill="#2B2B2B">「見積書を作るのに</text>
<text x="82" y="196" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" fill="#2B2B2B">　時間がかかってる」</text>
<text x="160" y="298" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#6E6A64">専門用語は要りません</text>

<line x1="292" y1="179" x2="312" y2="179" stroke="#6E6A64" stroke-width="2.5"/><path d="M 320 179 L 310 173 L 310 185 Z" fill="#6E6A64"/>

<rect x="324" y="84" width="252" height="190" rx="10" fill="#FFFFFF" stroke="#4A5C8C" stroke-width="2"/>
<rect x="324" y="84" width="252" height="36" rx="10" fill="#4A5C8C"/>
<rect x="324" y="106" width="252" height="14" fill="#4A5C8C"/>
<text x="450" y="108" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="bold">② AI がプログラムを書く</text>
<rect x="348" y="140" width="204" height="94" rx="6" fill="#2B2B2B"/>
<rect x="366" y="158" width="100" height="7" rx="3.5" fill="#8FD19E" fill-opacity="0.85"/>
<rect x="366" y="177" width="134" height="7" rx="3.5" fill="#9FC4F0" fill-opacity="0.85"/>
<rect x="366" y="196" width="76" height="7" rx="3.5" fill="#E8C46B" fill-opacity="0.85"/>
<rect x="366" y="215" width="116" height="7" rx="3.5" fill="#9FC4F0" fill-opacity="0.85"/>
<text x="450" y="298" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#6E6A64">読めなくても、③で確かめられます</text>

<line x1="582" y1="179" x2="602" y2="179" stroke="#6E6A64" stroke-width="2.5"/><path d="M 610 179 L 600 173 L 600 185 Z" fill="#6E6A64"/>

<text x="740" y="70" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" text-anchor="middle" fill="#2E7D4F" font-weight="bold">▼ AI に任せるだけでは、ここが抜けます</text>
<rect x="614" y="84" width="252" height="190" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/>
<rect x="614" y="84" width="252" height="36" rx="10" fill="#2E7D4F"/>
<rect x="614" y="106" width="252" height="14" fill="#2E7D4F"/>
<text x="740" y="108" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="15" text-anchor="middle" fill="#FFFFFF" font-weight="bold">③ 本当にできているか確かめる</text>
<rect x="636" y="146" width="17" height="17" rx="3" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="662" y="160" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" fill="#2B2B2B">決めたとおりに作られたか</text>
<rect x="636" y="180" width="17" height="17" rx="3" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="662" y="194" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" fill="#2B2B2B">作った AI に合格を出させない</text>
<rect x="636" y="214" width="17" height="17" rx="3" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="662" y="228" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="13" fill="#2B2B2B">最後に、あなたが動かして見る</text>
<text x="740" y="298" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="12.5" text-anchor="middle" fill="#2E7D4F" font-weight="bold">ひとつでも欠けたら、完成にしません</text>

<rect x="34" y="326" width="832" height="134" rx="10" fill="#F5F2EC" stroke="#D8D4CC" stroke-width="1"/>
<text x="62" y="360" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="16" fill="#2B2B2B" font-weight="bold">この流れの中で、あなたがやること</text>
<rect x="62" y="380" width="374" height="54" rx="27" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="1.5"/>
<circle cx="92" cy="407" r="13" fill="#1F6F6B"/>
<text x="92" y="412" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="bold">1</text>
<text x="116" y="402" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14.5" fill="#2B2B2B" font-weight="bold">何を作るかを決める</text>
<text x="116" y="422" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#6E6A64">現場のことを知っているのは、あなただけ</text>
<rect x="464" y="380" width="374" height="54" rx="27" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
<circle cx="494" cy="407" r="13" fill="#2E7D4F"/>
<text x="494" y="412" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="bold">3</text>
<text x="518" y="402" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="14.5" fill="#2B2B2B" font-weight="bold">動かして確かめてから承認する</text>
<text x="518" y="422" font-family="'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif" font-size="11.5" fill="#6E6A64">自分の書類を1枚、最初から最後まで作らせて確かめます</text>
</svg>
